<!doctype html>
  <html>
  <head><meta charset="utf-8"><title>Submissions</title></head>
  <body>
    <h1 id="title">Loading…</h1>
    <p id="count"></p>
    <button id="save">Test save dialog</button>
    <script>
      window.addEventListener('pywebviewready', async () => {
        const info = await pywebview.api.app_info();
        document.getElementById('title').textContent = `Submissions (v${info.version}) - ${info.database}`;
        document.getElementById('count').textContent = `${await pywebview.api.submission_count()} submissions`;
        document.getElementById('save').onclick = async () =>
          alert(await pywebview.api.choose_save_file('Test', 'xlsx') ?? 'cancelled');
      });
    </script>
  </body>
  </html>
